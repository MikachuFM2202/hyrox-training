<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HYROX Training</title>
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HYROX">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script>
// iOS 14–15.3 and Chrome < 98 lack these, and the app crashed on a blank loading screen. Tiny stand-ins:
// Plain old syntax on purpose: this must parse on the very browsers it patches.
if (!Object.hasOwn) Object.hasOwn = function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); };
[Array, String].forEach(function (T) { if (!T.prototype.at) Object.defineProperty(T.prototype, 'at', { configurable: true, writable: true,
  value: function (i) { i = Math.trunc(i) || 0; if (i < 0) i += this.length; return this[i]; } }); });
if (!window.structuredClone) window.structuredClone = function (v) { return v === undefined ? v : JSON.parse(JSON.stringify(v)); };   // only ever clones plain JSON data here
// Never leave someone staring at the loading screen: if the app breaks before it draws, say why.
function hyroxFail(msg) {
  var app = document.getElementById('app');
  if (app && (!app.children.length || app.querySelector('.loading'))) app.innerHTML = '<div class="loading-err"><b>The site couldn\u2019t start on this browser.</b><p>Update your phone\u2019s browser (iPhone: iOS 14 or newer), or open the link in Chrome or Safari instead of an in-app browser.</p><small>' + String(msg).replace(/[<>&]/g, '') + '</small></div>';
}
addEventListener('error', function (e) { hyroxFail(e.message || 'Script failed to load'); });
addEventListener('unhandledrejection', function (e) { hyroxFail(e.reason && e.reason.message || e.reason); });
</script>
<script type="module" src="app.js"></script>
<script nomodule>hyroxFail('This browser is too old for the site.');</script>
</body>
</html>
